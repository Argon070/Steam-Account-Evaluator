<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Steam-Account-Evaluator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <h1>Evaluate Steam Account</h1>

        <p>Your Name</p>
        <input type="text" placeholder="Name hier">

        <p>Your Steam URL</p>
        <input type="text" placeholder="Steam URL hier">

        <button>EVALUATE </button>

    </div>

   <div class="box2">
     <h3>{{ steamAccountName }}</h3>

        <p>
             Total Hours:
            <strong>{{ totalHours }}</strong>
        </p>

        <p>
             Owned Games:
            <strong>{{ ownedGames }}</strong>
        </p>

        <p>
             Account Created:
            <strong>{{ timeCreated }}</strong>
        </p>

        <p>
             Avatar URL
            <strong>{{ avatarURL }}</strong>
        </p>
    
    
    
    
   </div>


   

</body>
</html>
