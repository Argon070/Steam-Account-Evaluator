<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Steam-Account-Evaluator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="box">

        <h1>Evaluate Steam Account</h1>

        <p>Your Name</p>
        <input type="text" placeholder="Name hier">

        <p>Your Steam URL</p>
        <input type="text" placeholder="Steam URL hier">

        <button>EVALUATE ↓</button>

    </div>


    <div class="result">

        <h2>Your Rank</h2>

        <p>S Rank</p>
        <p>A Rank</p>
        <p>B Rank</p>
        <p>C Rank</p>
        <p>D Rank</p>
        <p>F Rank</p>

    </div>


    <div class="leaderboard">

        <h2>Leaderboard</h2>

        <p>1. Max - S Rank</p>
        <p>2. Alex - A Rank</p>
        <p>3. Tom - B Rank</p>

    </div>

</body>
</html>
